<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>小故事库</title>
<!-- 必须和 index.html 放在同一文件夹 -->
<script src="./data.js?v=3"></script>
<script>
// 全局状态
var sortOrder = 'desc';
var currentExpandedRole = null;
var searchDebounceTimer = null;

// 容错：data.js 没加载/格式错误时，给空数据，防止页面崩溃
// 注意：data.js 用 const 声明 STORY_DATA，那是全局词法绑定，不会挂到 window 上，
// 所以这里不能覆盖它，也不能用 var 重新声明（会 SyntaxError）。
if (typeof STORY_DATA === 'undefined' || !STORY_DATA || !Array.isArray(STORY_DATA.stories)) {
  window.STORY_DATA = { stories: [] };
}

function parseLocalDate(timeStr) {
  if (!timeStr) return 0;
  const m = String(timeStr).match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (!m) return new Date(timeStr).getTime() || 0;
  return new Date(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3])).getTime();
}

// 关键：优先读 data.js 的 const 词法绑定，读不到再读 window 兜底。
// 直接写 window.STORY_DATA 是错的 —— const 不会挂到 window 上。
function getStories() {
  if (typeof STORY_DATA !== 'undefined' && STORY_DATA && Array.isArray(STORY_DATA.stories)) {
    return STORY_DATA.stories;
  }
  if (window.STORY_DATA && Array.isArray(window.STORY_DATA.stories)) {
    return window.STORY_DATA.stories;
  }
  return [];
}

function getSortedStories() {
  const arr = getStories().map((s, idx) => ({ story: s, originIdx: idx }));
  arr.sort((a, b) => {
    const tA = parseLocalDate(a.story.createdAt);
    const tB = parseLocalDate(b.story.createdAt);
    return sortOrder === 'desc' ? tB - tA : tA - tB;
  });
  return arr;
}

function switchTab(targetTab) {
  document.querySelectorAll('.tab').forEach(tabEl => {
    tabEl.classList.toggle('active', tabEl.dataset.tab === targetTab);
  });
  document.getElementById('page-list').classList.toggle('active', targetTab === 'list');
  document.getElementById('page-roles').classList.toggle('active', targetTab === 'roles');
  const sortBtn = document.getElementById("sortBtn");
  if(sortBtn){
    sortBtn.style.visibility = targetTab === "list" ? "visible" : "hidden";
    sortBtn.style.pointerEvents = targetTab === "list" ? "auto" : "none";
  }
  // 切换时强制重新渲染，解决空白点不动
  if(targetTab === 'list') renderStories();
  if(targetTab === 'roles') renderRolePanel();
}

function toggleSortMode(){
  sortOrder = sortOrder === 'desc' ? 'asc' : 'desc';
  document.getElementById('sortLabel').innerText = sortOrder === 'desc' ? "最新发布" : "最早发布";
  document.getElementById('sortArrow').innerText = sortOrder === 'desc' ? "▾" : "▴";
  renderStories();
}

function coverHtml(url, cls) {
  if (url) {
    const safe = esc(url);
    return `<div class="${cls}"><img referrerpolicy="no-referrer" src="${safe}" alt="封面"
      onerror="this.parentNode.innerHTML='&lt;div class=&quot;cover-placeholder&quot;&gt;无封面&lt;/div&gt;'"></div>`;
  }
  return `<div class="${cls}"><div class="cover-placeholder">无封面</div></div>`;
}

function getRoleMap() {
  const map = {};
  getStories().forEach((story, idx)=>{
    (story.roles||[]).forEach(role=>{
      if(!map[role]) map[role]=[];
      map[role].push({ story, idx });
    })
  });
  return map;
}

function getSortedRoles(story) {
  const roles = (story.roles || []).slice();
  const priorityRole = "星海玲奈";
  const priority = roles.filter(r => r === priorityRole);
  const others = roles
    .filter(r => r !== priorityRole)
    .sort((a, b) => a.localeCompare(b, 'zh-CN'));
  return priority.concat(others);
}

function esc(str) {
  return String(str).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderStories() {
  const list = getSortedStories();
  const box = document.getElementById('storyList');
  if(!list.length){
    box.innerHTML = `<div class="empty">暂无小故事。<br>请在 data.js 中添加故事数据。</div>`;
    return;
  }
  box.innerHTML = list.map(item=>{
    const st = item.story;
    const oIdx = item.originIdx;
    const chips = getSortedRoles(st).map(r=>{
      return `<span class="role-chip">${esc(r)}</span>`;
    }).join('');
    return `
    <div class="card">
      <div class="story-item" data-story-index="${oIdx}">
        ${coverHtml(st.cover,'cover-wrap')}
        <div class="story-info">
          <div class="story-title">${esc(st.title||'未命名小故事')}</div>
          <div class="role-row">${chips||'<span class="hint">暂无登场角色</span>'}</div>
          <div class="story-meta">发布时间：${esc(st.createdAt||'未填写')}</div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderRolePanel() {
  const searchInput = document.getElementById('roleSearchInput');
  const kw = searchInput ? searchInput.value.trim().toLowerCase() : '';
  const box = document.getElementById('rolePanel');
  const roleMap = getRoleMap();
  let names = Object.keys(roleMap)
    .filter(n=> !kw || n.toLowerCase().includes(kw))
    .sort((a,b)=>{
      if (a === "星海玲奈") return -1;
      if (b === "星海玲奈") return 1;
      return a.localeCompare(b,'zh-CN');
    });
  if(currentExpandedRole && !names.includes(currentExpandedRole)){
    currentExpandedRole = null;
  }
  if(!names.length){
    if (getStories().length === 0) {
      box.innerHTML = `<div class="empty">暂无角色。<br>请先在 data.js 添加故事，并填写 roles 角色字段。</div>`;
    } else {
      box.innerHTML = `<div class="empty">${kw?'没有找到相关角色。':'故事里还没有填写任何登场角色。'}</div>`;
    }
    return;
  }
  box.innerHTML = names.map(name=>{
    const list = roleMap[name];
    const rows = list.map(item=>{
      const {story, idx} = item;
      return `
      <div class="role-story-row" data-story-index="${idx}">
        ${coverHtml(story.cover,'role-cover')}
        <div class="role-story-info">
          <div class="role-story-title">${esc(story.title||'未命名小故事')}</div>
          <div class="hint">发布时间：${esc(story.createdAt||'未填写')}</div>
        </div>
      </div>`;
    }).join('');
    const isExp = currentExpandedRole === name;
    return `
    <div class="role-card ${isExp?'open':''}" data-role="${esc(name)}">
      <div class="role-head">
        <div class="role-title-wrap">
          <div class="role-title"># ${esc(name)}</div>
        </div>
        <button class="role-count-btn" type="button">
          ${list.length} 个故事
        </button>
      </div>
      <div class="role-stories">${rows}</div>
    </div>`;
  }).join('');
}
function onRoleSearchInput(){
  clearTimeout(searchDebounceTimer);
  searchDebounceTimer = setTimeout(()=>{
    renderRolePanel();
  },150);
}
function toggleRoleCard(cardEl){
  const rawName = cardEl.dataset.role;
  if(currentExpandedRole === rawName){
    currentExpandedRole = null;
  }else{
    currentExpandedRole = rawName;
  }
  renderRolePanel();
}
function openDetailByIndex(index) {
  const story = getStories()[index];
  if(!story) return;
  const chips = getSortedRoles(story).map(r=>{
    return `<span class="role-chip">${esc(r)}</span>`;
  }).join(' ');
  const biliUrl = story.bilibiliUrl ? esc(story.bilibiliUrl) : '';
  const dyUrl = story.douyinUrl ? esc(story.douyinUrl) : '';
  document.getElementById('detailContent').innerHTML =
    coverHtml(story.cover,'detail-cover')
    +`<div class="detail-title">${esc(story.title||'未命名小故事')}</div>`
    +`<div class="detail-block"><div class="detail-label">简介</div><div class="detail-desc">${esc(story.desc||'暂无简介')}</div></div>`
    +`<div class="detail-block"><div class="detail-label">登场角色</div><div class="role-row">${chips||'<span class="hint">暂无登场角色</span>'}</div></div>`
    +`<div class="detail-block"><div class="detail-label">发布时间</div><div class="hint">${esc(story.createdAt||'未填写')}</div></div>`
    +`<div class="detail-actions">
        <button class="btn-bilibili ${biliUrl?'':'btn-disabled'}" ${biliUrl?`data-bilibili-url="${biliUrl}"`:'disabled'}>B站</button>
        <button class="btn-douyin ${dyUrl?'':'btn-disabled'}" ${dyUrl?`data-douyin-url="${dyUrl}"`:'disabled'}>抖音</button>
      </div>`;
  document.getElementById('detailMask').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeDetail() {
  document.getElementById('detailMask').classList.remove('show');
  document.body.style.overflow = '';
}
function bindGlobalEvents(){
  document.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click', ()=> switchTab(t.dataset.tab));
  });
  document.getElementById('sortBtn').addEventListener('click', toggleSortMode);
  document.getElementById('roleSearchInput').addEventListener('input', onRoleSearchInput);
  document.addEventListener('click', e=>{
    const storyItem = e.target.closest('.story-item');
    if(storyItem){
      openDetailByIndex(Number(storyItem.dataset.storyIndex));
      return;
    }
    const roleHeader = e.target.closest('.role-head');
    if(roleHeader){
      const card = roleHeader.closest('.role-card');
      if(card) toggleRoleCard(card);
      return;
    }
    const roleStoryRow = e.target.closest('.role-story-row');
    if(roleStoryRow){
      openDetailByIndex(Number(roleStoryRow.dataset.storyIndex));
      return;
    }
    if(e.target.id === 'detailMask'){
      closeDetail();
      return;
    }
    const biliBtn = e.target.closest('[data-bilibili-url]');
    if(biliBtn && !biliBtn.disabled){
      const u = biliBtn.dataset.bilibiliUrl;
      if(u) window.open(u,'_blank');
      return;
    }
    const dyBtn = e.target.closest('[data-douyin-url]');
    if(dyBtn && !dyBtn.disabled){
      const u = dyBtn.dataset.douyinUrl;
      if(u) window.open(u,'_blank');
    }
  });
  document.addEventListener('keydown', e=>{
    if(e.key === 'Escape' && document.getElementById('detailMask').classList.contains('show')){
      closeDetail();
    }
  });
}
window.onload=function(){
  renderStories();
  renderRolePanel();
  bindGlobalEvents();
}
</script>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;

  color: #1d1d1f;
  font-size: 16px;
  padding-bottom: 40px;
}
.header {
  background: #fff;
  padding: 16px;

  z-index: 10;

  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.header h1 {
  font-size: 22px;
  white-space:nowrap;
}

  display:flex;

  gap:4px;
  border:none;
  background:transparent;
  color:#666666;

  cursor:pointer;
  padding:6px 8px;
  border-radius:6px;
  height:36px;
  flex-shrink:0;
}
.sort-btn:active {
  background:#eeeeee;
}
.tabs {
  display: flex;
  background: #e5e5ea;
  border-radius: 12px;
  padding: 4px;
  margin: 12px 16px;
}
.tab {
  flex: 1;
  text-align: center;
  padding: 10px 0;
  border-radius: 10px;
  font-size: 16px;
  color: #666;
  cursor: pointer;
  transition: transform .15s ease, opacity .15s ease;
  user-select: none;
}
.tab.active {
  background: #fff;
  color: #007aff;
  font-weight: 600;
}
.tab:active {
  transform: scale(0.96);
  opacity: .7;
}
.page {
  display: none;
  padding: 0 16px;
}
.page.active {
  display: block;
}
.card {
  background: #fff;
  border-radius: 14px;
  padding: 10px;
  margin-bottom: 12px;
}
input[type=text] {
  width: 100%;
  border: 1px solid #d1d1d6;
  border-radius: 10px;
  padding: 12px;
  font-size: 16px;
  font-family: inherit;
}
.hint {
  font-size: 13px;
  color: #8e8e93;

}
.story-item {

.story-item:active {
  transform: scale(0.97);
  opacity: .75;
  background: #ececf0;
}
.cover-wrap {
  flex: 0 0 96px;
  width: 96px;
  height: 64px;
  border-radius: 8px;
  overflow: hidden;
  background: #e5e5ea;
}
.cover-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.cover-placeholder {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: #8e8e93;
  background: linear-gradient(135deg, #ececf0, #f7f7fa);
}
.story-info {
  flex: 1;
  min-width: 0;
  display:flex;
  flex-direction:column;
  gap:6px;
}
.story-title {
  font-size: 16px;
  font-weight: 700;
  word-break: break-all;
  line-height:1.4;
}
.story-meta {
  font-size: 12px;
  color: #8e8e93;
}
.role-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.role-chip {
  background: #e5e5ea;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 13px;
  color: #333;
}
.empty {
  text-align: center;
  color: #8e8e93;
  padding: 40px 20px;
  font-size: 15px;
  line-height: 1.7;
}
.role-card {
  background: #fff;
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 10px;
}
.role-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  min-height: 40px;
}
.role-title-wrap {
  flex: 1;
  min-width: 0;
}
.role-title {
  font-size: 17px;
  font-weight: 600;
  word-break: break-all;
}
.role-count-btn {
  border: none;
  background: #f2f2f7;
  color: #666;
  font-size: 13px;
  padding: 7px 12px;
  border-radius: 20px;
  white-space: nowrap;
  cursor: pointer;
  flex-shrink: 0;
}
.role-stories {
  display: none;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid #f0f0f5;
}
.role-card.open .role-stories {
  display: block;
}
.role-story-row {
  display: flex;
  gap: 10px;
  padding: 8px;
  border-radius: 8px;
  cursor: pointer;
  user-select: none;
}
.role-cover {
  flex: 0 0 96px;
  width: 96px;
  height: 64px;
  border-radius: 6px;
  overflow: hidden;
  background: #e5e5ea;
}
.role-cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.role-story-info {
  flex: 1;
  min-width: 0;
  font-size: 13px;
  line-height: 1.5;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 4px;
}
.role-story-title {
  font-weight: 600;
}
.modal-mask {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  z-index: 99;
  justify-content: center;
  align-items: center;
  padding: 16px;
}
.modal-mask.show {
  display: flex;
}
.modal {
  width: 100%;
  max-width: 480px;
  max-height: 90vh;
  overflow-y: auto;
  background: #fff;
  border-radius: 18px;
  position: relative;
  padding: 16px;
}
.detail-cover {
  width: 100%;
  height: 220px;
  border-radius: 12px;
  overflow: hidden;
  background: #e5e5ea;
  margin-bottom: 14px;
}
.detail-cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.detail-title {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 10px;
  word-break: break-all;
}
.detail-block {
  margin-bottom: 12px;
}
.detail-label {
  font-size: 13px;
  color: #8e8e93;
  margin-bottom: 6px;
}
.detail-desc {
  font-size: 14px;
  line-height: 1.7;
  color: #1d1d1f;
  background: #f9f9fb;
  border-radius: 10px;
  padding: 10px 12px;
  white-space: pre-wrap;
  word-break: break-word;
}
.detail-actions {
  display: flex;
  gap: 10px;
  margin-top: 16px;
}
.detail-actions button {
  flex: 1;
  text-align: center;
  padding: 12px 0;
  border-radius: 10px;
  font-size: 15px;
  border: none;
  cursor: pointer;
}
.btn-bilibili {
  background-color: #fb7299;
  color:#ffffff;
}
.btn-douyin {
  background-color: #000000;
  color:#ffffff;
}
.btn-disabled {
  background: #e2e2e7 !important;
  color: #a0a0a5 !important;
  cursor: not-allowed !important;
}
</style>
</head>
<body>
<div class="header">
  <h1>小故事库</h1>
  <button id="sortBtn" class="sort-btn">
    <span id="sortLabel">最新发布</span>
    <span id="sortArrow">▾</span>
  </button>
</div>
<div class="tabs">
  <div class="tab active" data-tab="list">故事</div>
  <div class="tab" data-tab="roles">角色</div>
</div>
<div class="page active" id="page-list">
  <div id="storyList"></div>
</div>
<div class="page" id="page-roles">
  <div class="card">
    <input type="text" id="roleSearchInput" placeholder="搜索登场角色">
  </div>
  <div id="rolePanel"></div>
</div>
<div class="modal-mask" id="detailMask">
  <div class="modal">
    <div id="detailContent"></div>
  </div>
</div>
</body>
</html>
